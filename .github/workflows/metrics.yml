name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: acro777x
          template: terminal
          base: ""
          config_timezone: Asia/Kolkata

          # --- Isometric commit calendar ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Coding habits / languages activity ---
          plugin_languages: yes
          plugin_languages_analysis_timezone: Asia/Kolkata
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # --- Achievements ---
          plugin_achievements: yes
          plugin_achievements_display: detailed

          # --- Notable contributions ---
          plugin_notable: yes
          plugin_notable_from: 2024-01-01

          filename: metrics.svg

          # --- Attempt to recolor to match README (black bg + neon green) ---
          extras_css: |
            svg { background-color: #000000 !important; }
            rect { fill: #000000 !important; }
            text, tspan { fill: #52f2b1 !important; }
