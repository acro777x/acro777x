

name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.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 }}
          user: acro777x
          template: terminal
          base: ""
          config_timezone: Asia/Kolkata

          # --- Isometric commit calendar ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Coding habits / languages activity ---
          plugin_languages: yes
          plugin_languages_analysis_timezone: Asia/Kolkata
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

          # --- Achievements ---
          plugin_achievements: yes
          plugin_achievements_display: detailed

          # --- Notable contributions (PRs to other repos) ---
          plugin_notable: yes
          plugin_notable_from: 2024-01-01

          filename: metrics.svg
