<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 110" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d12" />
      <stop offset="100%" stop-color="#0d141d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes cycle1 {
      0%, 17%   { opacity: 1; transform: translateY(0); }
      20%, 97%  { opacity: 0; transform: translateY(-4px); }
      100%      { opacity: 1; transform: translateY(0); }
    }
    @keyframes cycle2 {
      0%, 18%   { opacity: 0; transform: translateY(4px); }
      20%, 37%  { opacity: 1; transform: translateY(0); }
      40%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes cycle3 {
      0%, 38%   { opacity: 0; transform: translateY(4px); }
      40%, 57%  { opacity: 1; transform: translateY(0); }
      60%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes cycle4 {
      0%, 58%   { opacity: 0; transform: translateY(4px); }
      60%, 77%  { opacity: 1; transform: translateY(0); }
      80%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes cycle5 {
      0%, 78%   { opacity: 0; transform: translateY(4px); }
      80%, 97%  { opacity: 1; transform: translateY(0); }
      100%      { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes pulseTag {
      0%, 100% { opacity: 0.8; }
      50%      { opacity: 1; filter: drop-shadow(0 0 3px #52f2b1); }
    }

    .j1 { animation: cycle1 25s infinite ease-in-out; }
    .j2 { animation: cycle2 25s infinite ease-in-out; }
    .j3 { animation: cycle3 25s infinite ease-in-out; }
    .j4 { animation: cycle4 25s infinite ease-in-out; }
    .j5 { animation: cycle5 25s infinite ease-in-out; }
    .tag { animation: pulseTag 2.5s infinite ease-in-out; }

    text {
      font-family: 'Consolas', 'Fira Code', 'Monaco', monospace;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="678" height="108" rx="8" fill="url(#bgGrad)" stroke="#52f2b1" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Header line -->
  <line x1="1" y1="28" x2="679" y2="28" stroke="#52f2b1" stroke-opacity="0.15" stroke-width="1" />

  <!-- Header Title -->
  <text x="16" y="19" font-size="11.5" font-weight="bold" fill="#52f2b1" class="tag" letter-spacing="1">⚡ RANDOM_TECH_JOKE // BUFFER_FEED</text>
  <text x="664" y="19" font-size="11" fill="#8b949e" text-anchor="end">[AUTO_ROTATE]</text>

  <!-- Joke 1 -->
  <g class="j1">
    <text x="20" y="56" font-size="13.5" font-weight="bold" fill="#e6edf3">Q: Why do programmers prefer dark mode?</text>
    <text x="20" y="84" font-size="13.5" font-weight="bold" fill="#52f2b1">A: Because light attracts bugs.</text>
  </g>

  <!-- Joke 2 -->
  <g class="j2">
    <text x="20" y="56" font-size="13.5" font-weight="bold" fill="#e6edf3">Q: How many developers does it take to change a lightbulb?</text>
    <text x="20" y="84" font-size="13.5" font-weight="bold" fill="#52f2b1">A: None. It's a hardware problem.</text>
  </g>

  <!-- Joke 3 -->
  <g class="j3">
    <text x="20" y="56" font-size="13.5" font-weight="bold" fill="#e6edf3">Q: Why do Java developers wear glasses?</text>
    <text x="20" y="84" font-size="13.5" font-weight="bold" fill="#52f2b1">A: Because they don't C#.</text>
  </g>

  <!-- Joke 4 -->
  <g class="j4">
    <text x="20" y="56" font-size="13.5" font-weight="bold" fill="#e6edf3">Q: There are 10 types of people in the world:</text>
    <text x="20" y="84" font-size="13.5" font-weight="bold" fill="#52f2b1">A: Those who understand binary, and those who don't.</text>
  </g>

  <!-- Joke 5 -->
  <g class="j5">
    <text x="20" y="56" font-size="13.5" font-weight="bold" fill="#e6edf3">Q: A SQL query walks into a bar, walks up to two tables and asks...</text>
    <text x="20" y="84" font-size="13.5" font-weight="bold" fill="#52f2b1">A: "Can I join you?"</text>
  </g>
</svg>