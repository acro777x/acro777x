<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="auto">
  <defs>
    <!-- Cyan & Mint Glow Filter -->
    <filter id="cyberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Space Background -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#07111c" />
      <stop offset="65%" stop-color="#040910" />
      <stop offset="100%" stop-color="#020407" />
    </radialGradient>

    <!-- Globe Ocean & Atmosphere -->
    <radialGradient id="earthOcean" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0d243a" />
      <stop offset="70%" stop-color="#071422" />
      <stop offset="100%" stop-color="#030810" />
    </radialGradient>

    <radialGradient id="atmosphereHalo" cx="50%" cy="50%" r="50%">
      <stop offset="78%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="94%" stop-color="#00e5ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#52f2b1" stop-opacity="0.6" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="hudGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00e5ff" stroke-width="0.4" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <style>
    @keyframes laserDash1 {
      0%   { stroke-dashoffset: 400; opacity: 0.1; }
      40%  { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes laserDash2 {
      0%   { stroke-dashoffset: 500; opacity: 0.2; }
      50%  { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.1; }
    }
    @keyframes impactPulse {
      0%   { r: 3px; opacity: 1; stroke-width: 2.5px; }
      100% { r: 26px; opacity: 0; stroke-width: 0.4px; }
    }
    @keyframes radarScan {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    .laser-1 {
      stroke-dasharray: 220 220;
      animation: laserDash1 2.8s linear infinite;
    }
    .laser-2 {
      stroke-dasharray: 280 280;
      animation: laserDash2 3.4s linear infinite 0.7s;
    }
    .laser-3 {
      stroke-dasharray: 240 240;
      animation: laserDash1 3.1s linear infinite 1.4s;
    }
    .shockwave-1 {
      animation: impactPulse 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
    }
    .shockwave-2 {
      animation: impactPulse 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 0.8s;
    }
    .shockwave-3 {
      animation: impactPulse 2.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 1.5s;
    }
    .scan-beam {
      transform-origin: 410px 225px;
      animation: radarScan 10s linear infinite;
    }
    .live-dot {
      animation: blinkDot 1.4s infinite ease-in-out;
    }
    text {
      font-family: 'Consolas', 'Fira Code', 'Monaco', 'Courier New', monospace;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="818" height="438" rx="10" fill="url(#spaceBg)" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.2" />
  <rect x="2" y="2" width="816" height="436" fill="url(#hudGrid)" rx="9" />

  <!-- ================= TOP HEADER (CLEAN SPACING, NO UNDERSCORES) ================= -->
  <line x1="1" y1="36" x2="819" y2="36" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="1" />
  <circle cx="22" cy="18" r="4" fill="#00e5ff" class="live-dot" filter="url(#cyberGlow)" />
  <text x="36" y="22" font-size="11" font-weight="bold" fill="#00e5ff" letter-spacing="2.5">KASPERSKY CYBERTHREAT RADAR   //   REAL TIME THREAT TELEMETRY</text>
  <text x="796" y="22" font-size="10.5" fill="#8b949e" text-anchor="end" letter-spacing="1">[12:00:00 UTC]</text>

  <!-- ================= REALISTIC 3D EARTH GLOBE ================= -->
  <!-- Outer Atmosphere Halo & Sphere Base -->
  <circle cx="410" cy="225" r="145" fill="none" stroke="#00e5ff" stroke-opacity="0.12" stroke-dasharray="5 5" />
  <circle cx="410" cy="225" r="132" fill="url(#earthOcean)" stroke="#00e5ff" stroke-width="1.8" stroke-opacity="0.7" filter="url(#cyberGlow)" />
  <circle cx="410" cy="225" r="132" fill="url(#atmosphereHalo)" />

  <!-- 3D Sphericity Grids (Latitude & Longitude) -->
  <ellipse cx="410" cy="225" rx="132" ry="36" fill="none" stroke="#00e5ff" stroke-opacity="0.22" stroke-width="0.8" />
  <ellipse cx="410" cy="225" rx="132" ry="78" fill="none" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="0.8" />
  <ellipse cx="410" cy="225" rx="132" ry="112" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="0.8" />
  <ellipse cx="410" cy="225" rx="40" ry="132" fill="none" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.8" />
  <ellipse cx="410" cy="225" rx="80" ry="132" fill="none" stroke="#00e5ff" stroke-opacity="0.18" stroke-width="0.8" />
  <ellipse cx="410" cy="225" rx="114" ry="132" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="0.8" />

  <!-- ================= REALISTIC CONTINENT OUTLINES & NATIONS ================= -->
  <g fill="#52f2b1" fill-opacity="0.2" stroke="#52f2b1" stroke-width="1.2" stroke-opacity="0.85" filter="url(#cyberGlow)">
    <!-- EURASIA: Europe & Russia -->
    <path d="M 335,160 Q 350,140 375,135 Q 405,130 440,132 Q 480,135 510,148 Q 525,160 515,175 Q 490,172 465,165 Q 430,170 410,180 Q 380,182 360,195 Q 345,188 335,175 Z" />

    <!-- BRITISH ISLES -->
    <path d="M 338,150 Q 344,142 348,148 Q 345,155 338,150 Z" />

    <!-- INDIA (Distinct Triangular Peninsula) -->
    <path d="M 445,195 Q 458,190 472,192 Q 478,212 470,235 Q 462,252 458,258 Q 452,248 448,230 Q 442,212 445,195 Z" fill-opacity="0.32" stroke="#00e5ff" stroke-width="1.6" />

    <!-- MIDDLE EAST & ARABIAN PENINSULA -->
    <path d="M 405,192 Q 425,188 435,195 Q 438,215 425,232 Q 412,228 408,210 Z" />

    <!-- EAST ASIA & CHINA -->
    <path d="M 470,165 Q 500,162 522,175 Q 532,195 515,215 Q 492,212 478,195 Z" />

    <!-- JAPAN ARCHIPELAGO -->
    <path d="M 532,178 Q 538,172 540,182 Q 536,192 530,188 Z" />

    <!-- AFRICA -->
    <path d="M 345,200 Q 375,190 405,210 Q 415,235 418,265 Q 405,305 385,322 Q 365,300 355,260 Q 342,235 345,200 Z" />

    <!-- SOUTHEAST ASIA & INDONESIA -->
    <path d="M 485,230 Q 505,225 515,235 Q 495,248 485,230 Z" />
    <path d="M 475,255 Q 498,252 510,260 Q 492,266 475,255 Z" />

    <!-- AUSTRALIA -->
    <path d="M 495,282 Q 525,275 540,295 Q 535,325 510,335 Q 490,320 488,300 Z" />
  </g>

  <!-- ================= TARGET NATION HUBS (WITH LABELS) ================= -->
  <!-- Moscow / RU Hub -->
  <circle cx="430" cy="155" r="3.5" fill="#ff5f56" filter="url(#intenseGlow)" />
  <text x="430" y="148" font-size="9" fill="#ff5f56" text-anchor="middle" font-weight="bold">RU [01]</text>

  <!-- Frankfurt / DE Hub -->
  <circle cx="370" cy="168" r="3.5" fill="#00e5ff" filter="url(#intenseGlow)" />
  <text x="360" y="162" font-size="9" fill="#00e5ff" font-weight="bold">DE [02]</text>

  <!-- New Delhi / India Hub -->
  <circle cx="460" cy="215" r="4.5" fill="#52f2b1" filter="url(#intenseGlow)" />
  <text x="472" y="218" font-size="10" fill="#52f2b1" font-weight="bold">INDIA [TARGET #1]</text>

  <!-- Singapore Hub -->
  <circle cx="492" cy="245" r="3.5" fill="#00e5ff" />
  <text x="502" y="248" font-size="8.5" fill="#00e5ff">SG [04]</text>

  <!-- Tokyo / Japan Hub -->
  <circle cx="535" cy="182" r="3.5" fill="#ffbd2e" />
  <text x="545" y="180" font-size="8.5" fill="#ffbd2e">JP [05]</text>

  <!-- ================= KASPERSKY ATTACK LASER TRAJECTORIES ================= -->
  <!-- Attack Laser 1: Russia (430, 155) -> India Hub (460, 215) -->
  <path d="M 430 155 Q 425 185 460 215" fill="none" stroke="#ff2a55" stroke-width="2.2" class="laser-1" filter="url(#intenseGlow)" />
  <circle cx="460" cy="215" class="shockwave-1" fill="none" stroke="#ff2a55" />

  <!-- Attack Laser 2: Germany (370, 168) -> India Hub (460, 215) -->
  <path d="M 370 168 Q 405 170 460 215" fill="none" stroke="#00e5ff" stroke-width="2" class="laser-2" filter="url(#intenseGlow)" />
  <circle cx="460" cy="215" class="shockwave-2" fill="none" stroke="#00e5ff" />

  <!-- Attack Laser 3: Tokyo (535, 182) -> Singapore (492, 245) -->
  <path d="M 535 182 Q 528 215 492 245" fill="none" stroke="#ffbd2e" stroke-width="1.8" class="laser-3" />
  <circle cx="492" cy="245" class="shockwave-3" fill="none" stroke="#ffbd2e" />

  <!-- ================= TELEMETRY HUD PANELS ================= -->
  <!-- Left Panel: Kaspersky Threat Categories -->
  <rect x="20" y="52" width="195" height="110" rx="6" fill="#050a12" fill-opacity="0.9" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" />
  <text x="32" y="70" font-size="10" font-weight="bold" fill="#00e5ff" letter-spacing="1">▸ DETECTIONS BY PROTOCOL</text>
  <text x="32" y="88" font-size="9.5" fill="#e6edf3">OAS (ON ACCESS)  : <tspan fill="#ff2a55" font-weight="bold">4,891,200</tspan></text>
  <text x="32" y="104" font-size="9.5" fill="#e6edf3">ODS (ON DEMAND)  : <tspan fill="#ffbd2e">1,248,390</tspan></text>
  <text x="32" y="120" font-size="9.5" fill="#e6edf3">WAV (WEB VIRUS)  : <tspan fill="#52f2b1">2,810,450</tspan></text>
  <text x="32" y="136" font-size="9.5" fill="#e6edf3">MAV (MAIL VIRUS) : <tspan fill="#00e5ff">892,104</tspan></text>
  <text x="32" y="152" font-size="9.5" fill="#8b949e">IDS (INTRUSIONS) : <tspan fill="#7ee787">ACTIVE SHIELD</tspan></text>

  <!-- Right Panel: Top Targeted Nations -->
  <rect x="605" y="52" width="195" height="110" rx="6" fill="#050a12" fill-opacity="0.9" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" />
  <text x="617" y="70" font-size="10" font-weight="bold" fill="#00e5ff" letter-spacing="1">▸ TOP TARGETED NATIONS</text>
  <text x="617" y="88" font-size="9.5" fill="#e6edf3">#1 INDIA         : <tspan fill="#ff2a55" font-weight="bold">CRITICAL</tspan></text>
  <text x="617" y="104" font-size="9.5" fill="#e6edf3">#2 UNITED STATES : <tspan fill="#ffbd2e">ELEVATED</tspan></text>
  <text x="617" y="120" font-size="9.5" fill="#e6edf3">#3 GERMANY       : <tspan fill="#52f2b1">STABLE</tspan></text>
  <text x="617" y="138" font-size="9" fill="#8b949e">TOTAL ATTACKS TODAY:</text>
  <text x="617" y="154" font-size="14" font-weight="bold" fill="#00e5ff">18,492,034</text>

  <!-- Bottom Console Status -->
  <rect x="20" y="380" width="780" height="42" rx="6" fill="#050a12" fill-opacity="0.9" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1" />
  <text x="32" y="398" font-size="9.5" fill="#8b949e"><tspan fill="#52f2b1" font-weight="bold">[KASPERSKY LIVE FEED]</tspan> Global threat vectors synchronized across 300 edge nodes. Real time telemetry active.</text>
  <text x="32" y="413" font-size="9.5" fill="#8b949e"><tspan fill="#00e5ff" font-weight="bold">[CLICK TO OPEN]</tspan> View interactive 3D globe at <tspan fill="#52f2b1">cybermap.kaspersky.com</tspan></text>
</svg>