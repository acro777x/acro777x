<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="auto">
  <defs>
    <!-- Neon border glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Scanline pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000" stroke-width="1.2" opacity="0.18" />
    </pattern>

    <!-- Cyber header gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1219" />
      <stop offset="50%" stop-color="#0f1923" />
      <stop offset="100%" stop-color="#0a1219" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 2px #52f2b1); }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #52f2b1); }
    }
    @keyframes scanlineMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(440px); }
    }
    @keyframes typeStep1 {
      0% { opacity: 0; transform: translateX(-4px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeSeq {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cursor {
      animation: blink 0.9s infinite;
      fill: #52f2b1;
    }
    .pulse-badge {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
    .scan-beam {
      animation: scanlineMove 6s linear infinite;
      opacity: 0.07;
    }

    .step-cmd  { animation: fadeSeq 0.4s ease forwards 0.2s; opacity: 0; }
    .step-op1  { animation: fadeSeq 0.4s ease forwards 0.8s; opacity: 0; }
    .step-op2  { animation: fadeSeq 0.4s ease forwards 1.4s; opacity: 0; }
    .step-op3  { animation: fadeSeq 0.4s ease forwards 2.0s; opacity: 0; }
    .step-end  { animation: fadeSeq 0.4s ease forwards 2.6s; opacity: 0; }

    text {
      font-family: 'Consolas', 'Fira Code', 'Monaco', 'Courier New', monospace;
      font-size: 13.5px;
    }
    .term-title {
      font-size: 12px;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Terminal Frame -->
  <rect x="1" y="1" width="818" height="438" rx="9" fill="#070b0e" stroke="#52f2b1" stroke-opacity="0.35" stroke-width="1.2" />

  <!-- Terminal Window Header -->
  <path d="M 1 10 C 1 5 5 1 10 1 L 810 1 C 815 1 819 5 819 10 L 819 36 L 1 36 Z" fill="url(#headerGrad)" />
  <line x1="1" y1="36" x2="819" y2="36" stroke="#52f2b1" stroke-opacity="0.2" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="5.5" fill="#ff5f56" />
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e" />
  <circle cx="56" cy="18" r="5.5" fill="#27c93f" />

  <!-- Title Center -->
  <text x="410" y="22" text-anchor="middle" class="term-title">acro@mainframe: /var/operations — bash</text>

  <!-- Subtle CRT Scanlines Overlay -->
  <rect x="2" y="37" width="816" height="400" fill="url(#scanlines)" pointer-events="none" />
  
  <!-- Sweeping Cyber Light Beam -->
  <rect class="scan-beam" x="2" y="37" width="816" height="24" fill="#52f2b1" pointer-events="none" />

  <!-- Terminal Content Group -->
  <g transform="translate(24, 62)">
    <!-- Command Execution -->
    <g class="step-cmd">
      <text y="0">
        <tspan fill="#52f2b1" font-weight="bold">$</tspan>
        <tspan fill="#f0f6fc"> cat /var/operations/manifest.log</tspan>
      </text>
    </g>

    <!-- Operation 1: AcroMap -->
    <g class="step-op1" transform="translate(0, 32)">
      <text y="0">
        <tspan fill="#52f2b1" font-weight="bold" class="pulse-badge">[ACTIVE]</tspan>
        <tspan fill="#58a6ff" font-weight="bold">   acromap       </tspan>
        <tspan fill="#8b949e"> » </tspan>
        <tspan fill="#e6edf3">Deep Penetration Testing Framework — 32-Phase Automation</tspan>
      </text>
      <text y="21">
        <tspan fill="#52f2b1" opacity="0.7">           ├─ </tspan>
        <tspan fill="#8b949e">stack   : </tspan>
        <tspan fill="#7ee787">Bash</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#7ee787">GPG-signed commits</tspan>
      </text>
      <text y="41">
        <tspan fill="#52f2b1" opacity="0.7">           ├─ </tspan>
        <tspan fill="#8b949e">status  : </tspan>
        <tspan fill="#e3b341">v5.0</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#52f2b1">public</tspan>
      </text>
      <text y="61">
        <tspan fill="#52f2b1" opacity="0.7">           └─ </tspan>
        <tspan fill="#8b949e">repo    : </tspan>
        <tspan fill="#58a6ff">github.com/acro777x/acromap</tspan>
      </text>
    </g>

    <!-- Operation 2: Study-Hub -->
    <g class="step-op2" transform="translate(0, 122)">
      <text y="0">
        <tspan fill="#52f2b1" font-weight="bold" class="pulse-badge">[ACTIVE]</tspan>
        <tspan fill="#58a6ff" font-weight="bold">   study-hub     </tspan>
        <tspan fill="#8b949e"> » </tspan>
        <tspan fill="#e6edf3">Zero-Friction Campus AI Assistant</tspan>
      </text>
      <text y="21">
        <tspan fill="#52f2b1" opacity="0.7">           ├─ </tspan>
        <tspan fill="#8b949e">stack   : </tspan>
        <tspan fill="#7ee787">WhatsApp Bot</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#7ee787">Razorpay</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#7ee787">HMAC QR</tspan>
      </text>
      <text y="41">
        <tspan fill="#52f2b1" opacity="0.7">           ├─ </tspan>
        <tspan fill="#8b949e">status  : </tspan>
        <tspan fill="#52f2b1">deployed</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#d2a8ff">TRL-4 Innovation Award (IgNITionHack 2.0)</tspan>
      </text>
      <text y="61">
        <tspan fill="#52f2b1" opacity="0.7">           └─ </tspan>
        <tspan fill="#8b949e">repo    : </tspan>
        <tspan fill="#58a6ff">github.com/acro777x/study-hub-bot</tspan>
      </text>
    </g>

    <!-- Operation 3: Ghost-Chat -->
    <g class="step-op3" transform="translate(0, 212)">
      <text y="0">
        <tspan fill="#52f2b1" font-weight="bold" class="pulse-badge">[ACTIVE]</tspan>
        <tspan fill="#58a6ff" font-weight="bold">   ghost-chat    </tspan>
        <tspan fill="#8b949e"> » </tspan>
        <tspan fill="#e6edf3">Privacy-First Encrypted Comms</tspan>
      </text>
      <text y="21">
        <tspan fill="#52f2b1" opacity="0.7">           ├─ </tspan>
        <tspan fill="#8b949e">stack   : </tspan>
        <tspan fill="#7ee787">ESP32</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#7ee787">LoRa Mesh (866MHz)</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#7ee787">AES-256-GCM</tspan>
      </text>
      <text y="41">
        <tspan fill="#52f2b1" opacity="0.7">           ├─ </tspan>
        <tspan fill="#8b949e">status  : </tspan>
        <tspan fill="#e3b341">v3</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#52f2b1">captive-portal + companion Android app</tspan>
      </text>
      <text y="61">
        <tspan fill="#52f2b1" opacity="0.7">           └─ </tspan>
        <tspan fill="#8b949e">repo    : </tspan>
        <tspan fill="#58a6ff">github.com/acro777x/ghost-chat</tspan>
      </text>
    </g>

    <!-- Terminal Footer Prompt with Blinking Cursor -->
    <g class="step-end" transform="translate(0, 302)">
      <text y="0">
        <tspan fill="#52f2b1" font-weight="bold">$ </tspan>
        <tspan class="cursor" font-weight="bold">_</tspan>
      </text>
    </g>
  </g>
</svg>